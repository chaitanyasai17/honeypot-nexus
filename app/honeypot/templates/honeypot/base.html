<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}{{ company }}{% endblock %}</title>
  <style>
    :root {
      --primary: #FF5722;
      --primary-hover: #E64A19;
      --bg: #080B12;
      --surface: #0D111B;
      --surface-elevated: #111722;
      --border: #283142;
      --text: #F4F6FA;
      --text-muted: #A3ADBD;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: var(--bg); background-image: radial-gradient(ellipse at 80% 0%, rgba(255, 87, 34, 0.05) 0%, transparent 60%); color: var(--text); line-height: 1.5; }
    header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 12px 24px; display: flex; justify-content: space-between; align-items: center; }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 18px; color: var(--primary); text-decoration: none; }
    nav a { margin-left: 20px; text-decoration: none; color: var(--text-muted); font-size: 14px; font-weight: 500; transition: color 0.15s ease; }
    nav a:hover, nav a.active { color: var(--primary); }
    .container { max-width: 1080px; margin: 32px auto; padding: 0 16px; }
    footer { text-align: center; padding: 32px 16px; font-size: 13px; color: var(--text-muted); border-top: 1px solid var(--border); margin-top: 48px; background: var(--surface); }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 24px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
    .btn { display: inline-block; background: var(--primary); color: white; padding: 8px 16px; border-radius: 6px; text-decoration: none; font-size: 14px; font-weight: 600; border: none; cursor: pointer; transition: background 0.15s ease; }
    .btn:hover { background: var(--primary-hover); }
    .btn-secondary { background: #171D29; color: var(--text); border: 1px solid var(--border); }
    .btn-secondary:hover { background: #202737; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--text-muted); }
    .form-control { width: 100%; padding: 8px 12px; background: #111722; color: var(--text); border: 1px solid var(--border); border-radius: 6px; font-size: 14px; outline: none; }
    .form-control:focus { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(255, 87, 34, 0.2); }
    .alert-danger { background: rgba(255, 69, 69, 0.12); border: 1px solid rgba(255, 69, 69, 0.3); color: #FF4545; padding: 10px 14px; border-radius: 6px; margin-bottom: 16px; font-size: 13px; }
    .alert-success { background: rgba(41, 201, 149, 0.12); border: 1px solid rgba(41, 201, 149, 0.3); color: #29C995; padding: 10px 14px; border-radius: 6px; margin-bottom: 16px; font-size: 13px; }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  <header>
    <a href="/" class="brand">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
      {{ company }}
    </a>
    <nav>
      <a href="/">Home</a>
      <a href="/login">Employee Portal</a>
      <a href="/admin">Admin Console</a>
      <a href="/files">File Repository</a>
      <a href="/database">Database Query</a>
      <a href="/api">API v1</a>
      <a href="/shell">Web Terminal</a>
    </nav>
  </header>

  <div class="container">
    {% block content %}{% endblock %}
  </div>

  <footer>
    <p>&copy; 2026 {{ company }} — All rights reserved. Authorized corporate access only.</p>
    <p style="margin-top:6px; font-size:11px;">
      <a href="/dashboard/" style="color:var(--text-muted); text-decoration:none;">Private SOC Analyst Portal</a> •
      <a href="/auth/login" style="color:var(--text-muted); text-decoration:none;">Operator Login</a>
    </p>
  </footer>
</body>
</html>
