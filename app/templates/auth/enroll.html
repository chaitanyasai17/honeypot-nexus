<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MFA Enrolment — Honeypot Nexus</title>
  <style>
    :root {
      --bg-0: #080B12;
      --bg-1: #0D111B;
      --bg-2: #111722;
      --border: #283142;
      --text: #F4F6FA;
      --text-dim: #A3ADBD;
      --accent: #FF5722;
      --critical: #FF4545;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg-0);
      background-image: radial-gradient(ellipse at 60% 20%, rgba(255, 87, 34, 0.06) 0%, transparent 60%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .enroll-card {
      background: var(--bg-1);
      border: 1px solid var(--border);
      border-top: 2px solid var(--accent);
      border-radius: 12px;
      width: 100%;
      max-width: 460px;
      padding: 32px;
      box-shadow: 0 12px 48px rgba(0,0,0,0.65);
      text-align: center;
    }
    .qr-container {
      background: white;
      padding: 12px;
      border-radius: 8px;
      display: inline-block;
      margin: 16px 0;
    }
    .qr-image { width: 180px; height: 180px; display: block; }
    .secret-key {
      background: var(--bg-2);
      border: 1px solid var(--border);
      padding: 8px 12px;
      border-radius: 6px;
      font-family: monospace;
      font-size: 13px;
      color: #FF8A65;
      letter-spacing: 0.1em;
      margin-bottom: 20px;
      word-break: break-all;
    }
    .code-input {
      width: 100%;
      background: var(--bg-2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px;
      color: var(--text);
      font-size: 20px;
      letter-spacing: 0.2em;
      text-align: center;
      font-family: monospace;
      outline: none;
      margin-bottom: 16px;
    }
    .code-input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(255, 87, 34, 0.18); }
    .btn-submit {
      width: 100%;
      background: var(--accent);
      color: white;
      border: none;
      padding: 11px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.18s ease;
    }
    .btn-submit:hover { background: #E64A19; }
    .error-box {
      background: rgba(255, 69, 69, 0.11);
      border: 1px solid rgba(255, 69, 69, 0.3);
      color: var(--critical);
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 13px;
      margin-bottom: 18px;
      text-align: left;
    }
  </style>
</head>
<body>
  <div class="enroll-card">
    <h2 style="font-size: 20px; font-weight: 700; margin-bottom: 6px;">Setup Two-Factor Authenticator</h2>
    <p style="font-size: 13px; color: var(--text-dim); margin-bottom: 12px;">
      Scan the QR code using Google Authenticator, Authy, or Microsoft Authenticator to protect operator account <strong>{{ user.username }}</strong>.
    </p>

    {% if error %}
    <div class="error-box">{{ error }}</div>
    {% endif %}

    <div class="qr-container">
      <img src="{{ qr_data }}" alt="TOTP QR Code" class="qr-image">
    </div>

    <div style="font-size: 11px; color: var(--text-dim); margin-bottom: 6px;">Manual Setup Key:</div>
    <div class="secret-key">{{ secret }}</div>

    <form method="POST" action="/auth/enroll">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label style="display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 6px; text-align: left;">
        Enter verification code to confirm pairing:
      </label>
      <input type="text" name="code" class="code-input" maxlength="6" pattern="[0-9]{6}" placeholder="000000" required autofocus>
      <button type="submit" class="btn-submit">Confirm & Activate MFA &rarr;</button>
    </form>
  </div>
</body>
</html>
