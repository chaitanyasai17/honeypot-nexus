<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MFA Verification — Honeypot Nexus</title>
  <style>
    :root {
      --bg-0: #0a0e17;
      --bg-1: #0f1523;
      --border: #232c42;
      --text: #e6ebf5;
      --text-dim: #9aa6bf;
      --accent: #4c8dff;
      --critical: #ef4655;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg-0);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .auth-card {
      background: var(--bg-1);
      border: 1px solid var(--border);
      border-radius: 12px;
      width: 100%;
      max-width: 400px;
      padding: 32px;
      box-shadow: 0 12px 36px rgba(0,0,0,0.5);
      text-align: center;
    }
    .mfa-icon {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(76, 141, 255, 0.15);
      color: var(--accent);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
    }
    .brand-title { font-size: 18px; font-weight: 700; margin-bottom: 6px; }
    .brand-sub { font-size: 13px; color: var(--text-dim); margin-bottom: 24px; }
    .code-input {
      width: 100%;
      background: #151c2e;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px;
      color: var(--text);
      font-size: 24px;
      letter-spacing: 0.3em;
      text-align: center;
      font-family: monospace;
      outline: none;
      margin-bottom: 18px;
    }
    .code-input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(76, 141, 255, 0.2); }
    .btn-submit {
      width: 100%;
      background: var(--accent);
      color: white;
      border: none;
      padding: 11px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-submit:hover { background: #3b76e1; }
    .error-box {
      background: rgba(239, 70, 85, 0.12);
      border: 1px solid rgba(239, 70, 85, 0.3);
      color: var(--critical);
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 13px;
      margin-bottom: 18px;
      text-align: left;
    }
  </style>
</head>
<body>
  <div class="auth-card">
    <div class="mfa-icon">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
    </div>
    <div class="brand-title">Two-Factor Authentication</div>
    <div class="brand-sub">Enter the 6-digit verification code from your authenticator application for <strong>{{ user.username }}</strong>.</div>

    {% if error %}
    <div class="error-box">{{ error }}</div>
    {% endif %}

    <form method="POST" action="/auth/mfa">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <input type="text" name="code" class="code-input" maxlength="6" pattern="[0-9]{6}" placeholder="000000" required autofocus autocomplete="one-time-code">
      <button type="submit" class="btn-submit">Authenticate Session &rarr;</button>
    </form>

    <div style="margin-top: 20px;">
      <a href="/auth/logout" style="color: var(--text-dim); font-size: 12px; text-decoration: none;">&larr; Cancel and return to login</a>
    </div>
  </div>
</body>
</html>
