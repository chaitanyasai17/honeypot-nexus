<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SOC Authentication — Honeypot Nexus</title>
  <style>
    :root {
      --bg-0: #080B12;
      --bg-1: #0D111B;
      --bg-2: #111722;
      --border: #283142;
      --text: #F4F6FA;
      --text-dim: #A3ADBD;
      --accent: #FF5722;
      --critical: #FF4545;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg-0);
      background-image: radial-gradient(ellipse at 60% 20%, rgba(255, 87, 34, 0.06) 0%, transparent 60%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .auth-card {
      background: var(--bg-1);
      border: 1px solid var(--border);
      border-top: 2px solid var(--accent);
      border-radius: 12px;
      width: 100%;
      max-width: 400px;
      padding: 32px;
      box-shadow: 0 12px 48px rgba(0,0,0,0.65);
    }
    .brand-header { text-align: center; margin-bottom: 24px; }
    .brand-title { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .brand-badge { font-size: 11px; background: rgba(255, 87, 34, 0.15); color: var(--accent); padding: 3px 8px; border-radius: 4px; font-weight: 600; text-transform: uppercase; }
    .brand-sub { font-size: 13px; color: var(--text-dim); margin-top: 6px; }
    .form-group { margin-bottom: 18px; }
    .form-label { display: block; font-size: 12px; font-weight: 600; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 6px; }
    .form-input {
      width: 100%;
      background: #111722;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 14px;
      color: var(--text);
      font-size: 14px;
      outline: none;
    }
    .form-input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(255, 87, 34, 0.18); }
    .btn-submit {
      width: 100%;
      background: var(--accent);
      color: white;
      border: none;
      padding: 11px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.18s ease;
    }
    .btn-submit:hover { background: #E64A19; }
    .error-box {
      background: rgba(255, 69, 69, 0.11);
      border: 1px solid rgba(255, 69, 69, 0.3);
      color: var(--critical);
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 13px;
      margin-bottom: 18px;
    }
    .security-notice { text-align: center; font-size: 11px; color: #6A7589; margin-top: 24px; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="auth-card">
    <div class="brand-header">
      <div class="brand-title">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color: var(--accent);"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        Honeypot Nexus
      </div>
      <div class="brand-sub">Security Operations Center • Operator Login</div>
    </div>

    {% if error %}
    <div class="error-box">{{ error }}</div>
    {% endif %}

    <form method="POST" action="/auth/login{% if next %}?next={{ next }}{% endif %}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-group">
        <label class="form-label">Operator Username</label>
        <input type="text" name="username" class="form-input" placeholder="admin" required autofocus>
      </div>

      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" name="password" class="form-input" placeholder="••••••••••••" required>
      </div>

      <button type="submit" class="btn-submit">Proceed to MFA Verification &rarr;</button>
    </form>

    <div class="security-notice">
      RESTRICTED SYSTEM • Unauthorized access is monitored, recorded, and audited in compliance with security policies.
    </div>
  </div>
</body>
</html>
